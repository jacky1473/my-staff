services:
  app:
    container_name: staff-portal
    build:
      context: .
      dockerfile: Dockerfile
    image: staff-portal:latest
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - DB_PATH=/data/attendance.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-secret-key}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
