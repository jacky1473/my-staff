<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="jckGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="jckGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="jckDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="jckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal Tech Mark -->
  <g transform="translate(15, 10)">
    <polygon points="40,2 75,22 75,62 40,82 5,62 5,22" fill="url(#jckDark)" stroke="url(#jckGrad1)" stroke-width="3" filter="url(#jckGlow)" opacity="0.4"/>
    <polygon points="40,2 75,22 75,62 40,82 5,62 5,22" fill="url(#jckDark)" stroke="url(#jckGrad1)" stroke-width="2.5"/>
    
    <polygon points="40,10 68,26 40,42 12,26" fill="#00d9ff" opacity="0.25"/>
    <polygon points="12,26 40,42 40,74 12,58" fill="#3b82f6" opacity="0.3"/>
    <polygon points="40,42 68,26 68,58 40,74" fill="#10b981" opacity="0.35"/>

    <path d="M26 30 L40 38 L54 30" stroke="#00d9ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 38 L40 68" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 45 L40 55 L58 45" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <circle cx="40" cy="42" r="4.5" fill="#ffffff" filter="url(#jckGlow)"/>
    <circle cx="40" cy="42" r="2.5" fill="#00d9ff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="url(#jckGrad2)">JCK</text>
    <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="300" letter-spacing="4" fill="#ffffff">SOFTWARE</text>
    <text x="2" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" fill="#94a3b8">REMOTE SOFTWARE SOLUTIONS • ENTERPRISE CLOUD</text>
    <circle cx="378" cy="45" r="4" fill="#10b981" filter="url(#jckGlow)"/>
  </g>
</svg>
