<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#00d9ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ company_name }}">
  <meta name="description" content="{{ company_name }} — Premium Staff Attendance Portal">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <title>{% block title %}{{ company_name }}{% endblock %}</title>
  <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<footer class="app-global-footer py-3 mt-4" style="border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div class="d-flex align-items-center gap-2">
      <img src="/static/jck-icon.svg" alt="JCK Software" style="height: 20px; width: 20px;">
      <span class="text-muted small">© {{ current_year }} <strong>{{ copyright_company }}</strong>. All rights reserved.</span>
    </div>
    <div class="small">
      <a href="/sales" class="text-decoration-none text-muted me-3">💼 Product Overview</a>
      <a href="/workflow" class="text-decoration-none text-muted">📖 Architecture</a>
    </div>
  </div>
</footer>

<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
