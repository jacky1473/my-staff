<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#181c22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <title>{% block title %}{{ company_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    /* Notification Bell */
    .notif-btn { position:relative; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--text-muted); transition:all var(--transition); }
    .notif-btn:hover { color:var(--text-primary); border-color:var(--border-light); }
    .notif-badge { position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:.6rem; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; line-height:1; }
    .notif-dropdown { position:absolute; top:calc(100% + 8px); right:0; width:320px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); z-index:999; display:none; max-height:400px; overflow:hidden; flex-direction:column; }
    .notif-dropdown.open { display:flex; }
    .notif-header { padding:.6rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .notif-header span { font-size:.8rem; font-weight:600; color:var(--text-secondary); }
    .notif-header button { background:none; border:none; font-size:.75rem; color:var(--accent); cursor:pointer; }
    .notif-list { overflow-y:auto; flex:1; }
    .notif-item { padding:.7rem 1rem; border-bottom:1px solid var(--border); cursor:pointer; transition:background var(--transition); }
    .notif-item:hover { background:var(--bg-hover); }
    .notif-item.unread { border-left:3px solid var(--accent); }
    .notif-item.success { border-left-color:var(--green); }
    .notif-item.error   { border-left-color:var(--red); }
    .notif-item.warning { border-left-color:var(--amber); }
    .notif-title { font-size:.82rem; font-weight:600; color:var(--text-primary); }
    .notif-msg   { font-size:.76rem; color:var(--text-secondary); margin-top:2px; line-height:1.4; }
    .notif-time  { font-size:.7rem; color:var(--text-muted); margin-top:3px; }
    .notif-empty { padding:2rem; text-align:center; color:var(--text-muted); font-size:.82rem; }
    .notif-wrap  { position:relative; }
    @media(max-width:480px) { .notif-dropdown { width:90vw; right:-40px; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
