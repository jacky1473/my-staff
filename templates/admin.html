<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Management Console (Admin)</h2>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
        <div class="card p-4 shadow-sm">
            <h4>Generate Attendance Reports</h4>
            <p class="text-muted">Export data arrays straight to standardized Excel configuration sheets.</p>
            <div class="mt-3">
                <a href="/export/weekly" class="btn btn-outline-primary btn-lg me-3">Download Weekly Report (.xlsx)</a>
                <a href="/export/monthly" class="btn btn-outline-success btn-lg">Download Monthly Report (.xlsx)</a>
            </div>
        </div>
    </div>
</body>
</html>
