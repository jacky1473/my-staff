<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Management Console (Admin)</h2>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}<div class="alert alert-success">{{ msg }}</div>{% endfor %}
            {% endif %}
        {% endwith %}

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card p-4 shadow-sm h-100">
                    <h4>Generate Attendance Reports</h4>
                    <div class="mt-3">
                        <a href="/export/weekly" class="btn btn-outline-primary w-100 mb-2">Download Weekly Report (.xlsx)</a>
                        <a href="/export/monthly" class="btn btn-outline-success w-100">Download Monthly Report (.xlsx)</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card p-4 shadow-sm h-100">
                    <h4>Add New Support Staff</h4>
                    <form action="/add_user" method="POST">
                        <div class="mb-2">
                            <input type="text" name="new_username" class="form-control" placeholder="New Username" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" name="new_password" class="form-control" placeholder="Temporary Password" required>
                        </div>
                        <div class="mb-2">
                            <select name="department" class="form-control" required>
                                <option value="IT">IT</option>
                                <option value="MIS">MIS</option>
                                <option value="QA">QA</option>
                                <option value="TL">TL</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
