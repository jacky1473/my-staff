<!DOCTYPE html>
<html>
<head>
    <title>Account Recovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364); background-size: 400% 400%; animation: gradientBG 15s ease infinite; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; min-height: 100vh;}
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        .form-control { background: rgba(255, 255, 255, 0.9); border: none; }
        .btn-magical { background: linear-gradient(90deg, #f5af19 0%, #f12711 100%); border: none; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 glass-card" style="width: 420px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-warning">Account Recovery</h3>
                <p class="text-light small opacity-75">Secure Password Reset Engine</p>
            </div>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}{% for msg in messages %}<div class="alert alert-danger py-2 text-center">{{ msg }}</div>{% endfor %}{% endif %}
            {% endwith %}

            {% if step == '1' %}
            <form method="POST" action="/forgot?step=1">
                <div class="mb-4">
                    <label class="fw-bold small text-light opacity-75">ENTER YOUR USERNAME</label>
                    <input type="text" name="username" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-magical w-100 mb-3">Retrieve Security Question</button>
                <a href="/login" class="btn btn-outline-light w-100 border-0">Back to Login</a>
            </form>
            {% elif step == '2' %}
            <form method="POST" action="/forgot?step=2">
                <input type="hidden" name="username" value="{{ username }}">
                <div class="mb-3">
                    <label class="fw-bold small text-warning">SECURITY QUESTION:</label>
                    <p class="fs-5">{{ question }}</p>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-light opacity-75">YOUR ANSWER</label>
                    <input type="text" name="security_answer" class="form-control" required>
                </div>
                <div class="mb-4 border-top border-secondary pt-3">
                    <label class="fw-bold small text-light opacity-75">ENTER NEW PASSWORD</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-magical w-100">Reset Password</button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
