<!DOCTYPE html>
<html>
<head>
    <title>System Initialization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30); background-size: 400% 400%; animation: gradientBG 15s ease infinite; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; min-height: 100vh;}
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        .form-control { background: rgba(255, 255, 255, 0.9); border: none; }
        .btn-magical { background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%); border: none; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 glass-card" style="width: 500px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-info">System Initialization</h3>
                <p class="text-light small opacity-75">Register your Company & Super Admin to begin.</p>
            </div>
            <form method="POST" action="/setup">
                <div class="mb-3 border-bottom border-secondary pb-3">
                    <label class="fw-bold small text-light opacity-75">COMPANY NAME</label>
                    <input type="text" name="company_name" class="form-control" placeholder="e.g. Sysnet Global" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-light opacity-75">ADMIN USERNAME</label>
                    <input type="text" name="admin_username" class="form-control" placeholder="admin" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-light opacity-75">ADMIN PASSWORD</label>
                    <input type="password" name="admin_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small text-light opacity-75">SECURITY QUESTION (For Password Recovery)</label>
                    <input type="text" name="security_question" class="form-control" placeholder="e.g. What is your first pet's name?" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold small text-light opacity-75">SECURITY ANSWER</label>
                    <input type="text" name="security_answer" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-magical btn-lg w-100 shadow-sm">Initialize Database</button>
            </form>
        </div>
    </div>
</body>
</html>
