{% extends "base.html" %}
{% block title %}Setup — {{ company_name }}{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width:440px;">
    <div class="auth-logo"><span class="brand-mark lg">◆</span>Initial Setup</div>
    {% with messages = get_flashed_messages() %}{% if messages %}{% for msg in messages %}
      <div class="flash-alert alert alert-danger py-2 mb-3" style="font-size:.8rem;">{{ msg }}</div>
    {% endfor %}{% endif %}{% endwith %}
    <form method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label class="form-label">Company Name</label><input type="text" name="company_name" class="form-control" placeholder="Acme Corp" required></div>
      <div class="form-group"><label class="form-label">Admin Username</label><input type="text" name="admin_username" class="form-control" placeholder="admin" required></div>
      <div class="form-group"><label class="form-label">Admin Password</label><div class="pw-container"><input type="password" name="admin_password" class="form-control" placeholder="Min 6 characters" required><button type="button" class="pw-toggle">👁</button></div></div>
      <div class="form-group"><label class="form-label">Security Question</label><input type="text" name="security_question" class="form-control" placeholder="What is your pet's name?" required></div>
      <div class="form-group"><label class="form-label">Security Answer</label><input type="text" name="security_answer" class="form-control" placeholder="Answer" required></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg mt-1">Initialize System</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>document.addEventListener('DOMContentLoaded',()=>{initPasswordToggles();initAlertToasts();});</script>{% endblock %}
