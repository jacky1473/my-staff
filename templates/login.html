<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ company_name }} | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .login-card {
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: rgba(255,255,255,0.96);
        }
        .brand-icon { font-size: 3rem; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5 login-card" style="width:420px;">
        <div class="text-center mb-4">
            <div class="brand-icon mb-2">🏢</div>
            <h4 class="fw-bold">{{ company_name }} Portal</h4>
            <p class="text-muted small mb-0">Enter your credentials to access the system</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-danger py-2 text-center small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" autocomplete="on">
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">USERNAME</label>
                <input type="text" name="username" class="form-control form-control-lg bg-light"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-1">
                <label class="form-label fw-bold small text-secondary">PASSWORD</label>
                <input type="password" name="password" class="form-control form-control-lg bg-light"
                       autocomplete="current-password" required>
            </div>
            <div class="text-end mb-4">
                <a href="/forgot" class="text-primary small text-decoration-none">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold">Login</button>
        </form>
    </div>
</div>
</body>
</html>
