<!DOCTYPE html>
<html>
<head>
    <title>Office Portal | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.95);
        }
        .brand-icon {
            font-size: 3rem;
            color: #203a43;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 login-card" style="width: 420px;">
            <div class="text-center mb-4">
                <div class="brand-icon mb-2">🏢</div>
                <h3 class="fw-bold">Employee Portal</h3>
                <p class="text-muted small">Enter your credentials to access the system</p>
            </div>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}<div class="alert alert-danger py-2 text-center">{{ msg }}</div>{% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <div class="mb-3">
                    <label class="fw-bold small text-secondary">USERNAME</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold small text-secondary">PASSWORD</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                </div>
                <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm">Secure Login</button>
            </form>
        </div>
    </div>
</body>
</html>
