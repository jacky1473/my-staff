<!DOCTYPE html>
<html>
<head>
    <title>Office Portal | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            /* Animated Magical Gradient */
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30, #243b55);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-card {
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
        }
        .form-control:focus {
            box-shadow: 0 0 10px rgba(0, 201, 255, 0.5);
        }
        .brand-icon {
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .btn-magical {
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            border: none;
            color: #000;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-magical:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 201, 255, 0.6);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 login-card" style="width: 420px;">
            <div class="text-center mb-4">
                <div class="brand-icon mb-2">🏢</div>
                <h3 class="fw-bold">Employee Portal</h3>
                <p class="text-light small opacity-75">Enter your credentials to access the system</p>
            </div>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}<div class="alert alert-danger py-2 text-center" style="background: rgba(220,53,69,0.8); color: white; border: none;">{{ msg }}</div>{% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <div class="mb-3">
                    <label class="fw-bold small text-light opacity-75">USERNAME</label>
                    <input type="text" name="username" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold small text-light opacity-75">PASSWORD</label>
                    <input type="password" name="password" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-magical btn-lg w-100 shadow-sm">Secure Login</button>
            </form>
        </div>
    </div>
</body>
</html>
