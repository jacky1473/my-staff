# nginx reverse proxy: port 80 -> the my-staff container on 127.0.0.1:5000
#
# Install:
#   sudo cp deploy/nginx/my-staff.conf /etc/nginx/sites-available/my-staff.conf
#   sudo ln -s /etc/nginx/sites-available/my-staff.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name below with your real domain or the host's IP.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/my-staff.access.log;
    error_log  /var/log/nginx/my-staff.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # These map 1:1 to the ProxyFix(x_for=1, x_proto=1, x_host=1, x_port=1)
        # trust settings in app.py — keep both sides in sync if this changes.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# ---------------------------------------------------------------------------
# Recommended next step: this config is plain HTTP only, matching the
# FORCE_HTTP_COOKIES=true setting in my-staff.env. If/when this becomes
# reachable from outside a trusted LAN, get a TLS cert (e.g.
# `sudo certbot --nginx -d your-domain`) and remove FORCE_HTTP_COOKIES from
# the env file so cookies go back to requiring HTTPS.
# ---------------------------------------------------------------------------
